<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>NewAge - Focus Lockdown</title>
    <style>
        * { 
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            box-sizing: border-box;
        }
        body, html {
            margin: 0; padding: 0; 
            width: 100%; height: 100%;
            background-color: #000;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }
        
        #game-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: auto;
            height: auto;
            padding:env(safe-area-inset-top, 0px) 
                    env(safe-area-inset-right, 0px) 
                    env(safe-area-inset-bottom, 0px) 
                    env(safe-area-inset-left, 0px);
            box-sizing: border-box;
        }

        #ruffle-container {
            width: 100% !important;    /* РОЗТЯГНУТИ */
            height: 100% !important;   /* РОЗТЯГНУТИ */
        }

        ruffle-player {
            width: 100% !important;    /* РОЗТЯГНУТИ */
            height: 100% !important;   /* РОЗТЯГНУТИ */
        }
        
        ruffle-player::part(splash) { 
            display: none !important; 
        }
        
        ruffle-player::part(container) {
            image-rendering: pixelated;
        }
        
        /* Overlay для миші - перехоплює всі touch events */
        #mouse-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9998;
            display: none;
            background: transparent;
            touch-action: none;
        }
        
        /* Віртуальна мишка */
        #virtual-cursor {
            position: fixed;
            width: 28px;
            height: 28px;
            pointer-events: none;
            z-index: 10000;
            display: none;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="white" stroke="black" stroke-width="2"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></svg>') no-repeat;
            background-size: contain;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }
        
        #virtual-cursor.clicking {
            filter: drop-shadow(0 0 8px rgba(76,175,80,0.8)) drop-shadow(0 2px 4px rgba(0,0,0,0.5));
            transform: scale(1.1);
        }
        
        /* Кнопки керування */
        .control-btn {
            position: fixed;
            z-index: 10001;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(40, 40, 40, 0.85);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            cursor: pointer;
            will-change: transform;
            transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
            user-select: none;
        }
        
        .control-btn:active {
            transform: scale(0.95);
        }
        
        .control-btn.active {
            background: #27ae60;
            border-color: #fff;
            box-shadow: 0 0 20px #27ae60;
        }
        
        #mouseBtn {
            bottom: 120px;
            right: 30px;
        }
        
        #kbdBtn {
            bottom: 30px;
            right: 30px;
        }
        
        #resetBtn {
            bottom: 30px;
            left: 30px;
            font-size: 28px;
        }
        
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial, sans-serif;
            font-size: 18px;
            z-index: 10002;
            display: none;
        }
        
        #info-panel {
            position: fixed;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
            z-index: 9997;
            display: none;
        }
        
        #info-panel.active {
            display: block;
        }
        
        #mouse-hint {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            color: white;
            padding: 20px 30px;
            border-radius: 12px;
            font-family: Arial, sans-serif;
            font-size: 16px;
            z-index: 9996;
            display: none;
            text-align: center;
            pointer-events: none;
        }
        
        #mouse-hint.active {
            display: block;
            animation: fadeOut 2.5s forwards;
        }
        
        @keyframes fadeOut {
            0% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Прихований input-посередник для IME кирилиці в WebView -->
    <input id="ime-proxy" type="text" inputmode="text"
        style="position:fixed;opacity:0;pointer-events:none;width:1px;height:1px;top:-9999px;left:-9999px;border:none;outline:none;z-index:-1;"
        autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />

    <div id="loading">Завантаження...</div>
    
    <div id="game-wrapper">
        <div id="ruffle-container"></div>
    </div>
    
    <div id="mouse-overlay"></div>
    <div id="virtual-cursor"></div>
    
    <div id="mouse-hint">
        🖱️ Режим миші активовано<br>
        <small>Рухайте пальцем = курсор | Тап = ЛКМ</small>
    </div>
    
    <button class="control-btn" id="mouseBtn" title="Virtual Mouse">🖱️</button>
    <button class="control-btn" id="kbdBtn" title="Keyboard">⌨️</button>
    <button class="control-btn" id="resetBtn" title="Reset Zoom">⟲</button>
    
    <div id="info-panel">
        Scale: <span id="info-scale">1.0</span>x | 
        Pos: (<span id="info-pos">0, 0</span>) | 
        FPS: <span id="info-fps">--</span>
    </div>

    <script src="./ruffle/ruffle.js"></script>

    <script>
        // --- ГЛОБАЛЬНІ ЗМІННІ ---
        const wrapper = document.getElementById('game-wrapper');
        const overlay = document.getElementById('mouse-overlay');
        const virtualCursor = document.getElementById('virtual-cursor');
        const mouseBtn = document.getElementById('mouseBtn');
        const kbdBtn = document.getElementById('kbdBtn');
        const resetBtn = document.getElementById('resetBtn');
        const loadingEl = document.getElementById('loading');
        const infoPanel = document.getElementById('info-panel');
        const mouseHint = document.getElementById('mouse-hint');
        
        let scale = 1;
        let baseScale = 1;
        let minScale = 1;
        let maxScale = 5;
        let tx = 0, ty = 0;
        let isKeyboardActive = false;
        let isMouseMode = false;
        
        // Віртуальна мишка
        let mouseX = 0, mouseY = 0;
        let lastTouchX = 0, lastTouchY = 0;
        let isMovingMouse = false;
        let touchStartTime = 0;
        let rufflePlayer = null;
        let activePointerId = null;
        
        // Zoom & Pan
        let isPinching = false;
        let isPanning = false;
        let startDist = 0, startScale = 1, startTx = 0, startTy = 0;
        let midX = 0, midY = 0;
        let panStartX = 0, panStartY = 0, panInitTx = 0, panInitTy = 0;
        
        // FPS counter
        let lastFrameTime = performance.now();
        let fps = 0;
        let animationFrameId = null;
        let lastLoggedScale = 0;
        
        // --- ОТРИМАННЯ ЦІЛЬОВОГО ЕЛЕМЕНТУ ДЛЯ ПОДІЙ ---
        function getTargetElement() {
            if (!rufflePlayer) {
                rufflePlayer = document.querySelector("ruffle-player");
            }
            // Спочатку пробуємо отримати canvas з shadowRoot
            if (rufflePlayer?.shadowRoot) {
                const canvas = rufflePlayer.shadowRoot.querySelector("canvas");
                if (canvas) return canvas;
            }
            // Якщо немає canvas, повертаємо сам player
            return rufflePlayer;
        }
        
        // --- ВІДПРАВКА ПОДІЙ МИШІ ---
        function sendMouseEvent(type, x, y, button = 0) {
            const target = getTargetElement();
            if (!target) return false;
            
            try {
                // Конвертуємо координати відносно цільового елементу
                const rect = target.getBoundingClientRect();
                const relativeX = x - rect.left;
                const relativeY = y - rect.top;
                
                // Перевіряємо чи координати в межах елементу
                if (relativeX < 0 || relativeX > rect.width || 
                    relativeY < 0 || relativeY > rect.height) {
                    return false;
                }
                
                const evt = new MouseEvent(type, {
                    bubbles: true,
                    cancelable: true,
                    view: window,
                    clientX: x,
                    clientY: y,
                    button: button,
                    buttons: type === "mouseup" ? 0 : (button === 2 ? 2 : 1),
                    pointerId: 1,
                    isPrimary: true,
                    pointerType: "mouse"
                });
                
                return target.dispatchEvent(evt);
            } catch (e) {
                console.warn('Помилка відправки події:', e);
                return false;
            }
        }
        
        // --- ВІДПРАВКА ПОДІЙ pointer ---
        function sendPointerEvent(type, x, y, button = 0, pressure = 0.5) {
            const target = getTargetElement();
            if (!target) return false;
            
            try {
                const evt = new PointerEvent(type, {
                    bubbles: true,
                    cancelable: true,
                    view: window,
                    clientX: x,
                    clientY: y,
                    button: button,
                    buttons: type === "pointerup" ? 0 : (button === 2 ? 2 : 1),
                    pointerId: 1,
                    isPrimary: true,
                    pointerType: "mouse",
                    pressure: pressure,
                    width: 1,
                    height: 1
                });
                
                return target.dispatchEvent(evt);
            } catch (e) {
                return false;
            }
        }
        
        // --- ОНОВЛЕННЯ ПОЗИЦІЇ КУРСОРА ---
        function updateCursorPosition(x, y) {
            mouseX = Math.max(0, Math.min(window.innerWidth, x));
            mouseY = Math.max(0, Math.min(window.innerHeight, y));
            virtualCursor.style.left = mouseX + 'px';
            virtualCursor.style.top = mouseY + 'px';
        }
        
        // --- ПОДІЇ OVERLAY ---
        overlay.addEventListener('touchstart', (e) => {
            e.preventDefault();
            e.stopPropagation();
            // ЦЕ ПОТРІБНО ПОВЕРНУТИ:
            if (e.touches.length === 1 && activePointerId === null) {
                activePointerId = e.touches[0].identifier;
                lastTouchX = e.touches[0].pageX;
                lastTouchY = e.touches[0].pageY;
                isMovingMouse = false;
                touchStartTime = Date.now();
        
                // Оновити позицію курсора
                // updateCursorPosition(e.touches[0].pageX, e.touches[0].pageY);
        
                // Відправити події
                sendPointerEvent('pointerenter', mouseX, mouseY, 0, 0);
                sendPointerEvent('pointerover', mouseX, mouseY, 0, 0);
            }
        }, {passive: false, capture: true});
        
        overlay.addEventListener('touchmove', (e) => {
            e.preventDefault();
            e.stopPropagation();
            
            // Шукаємо наш палець
            let touch = null;
            for (let i = 0; i < e.touches.length; i++) {
                if (e.touches[i].identifier === activePointerId) {
                    touch = e.touches[i];
                    break;
                }
            }
            
            if (!touch) return;
            
            const dx = (touch.pageX - lastTouchX) * 1.5;
            const dy = (touch.pageY - lastTouchY) * 1.5;
            
            if (Math.hypot(touch.pageX - lastTouchX, touch.pageY - lastTouchY) > 8) {
                isMovingMouse = true;
            }
            
            // Оновлюємо позицію курсора
            updateCursorPosition(mouseX + dx, mouseY + dy);
            
            lastTouchX = touch.pageX;
            lastTouchY = touch.pageY;
            
            // Відправляємо події руху
            sendPointerEvent('pointermove', mouseX, mouseY, 0, 0.5);
            sendMouseEvent('mousemove', mouseX, mouseY, 0);
            
        }, {passive: false, capture: true});
        
        overlay.addEventListener('touchend', (e) => {
            e.preventDefault();
            e.stopPropagation();
            
            // Перевіряємо чи це наш палець
            let ourTouchEnded = true;
            for (let i = 0; i < e.touches.length; i++) {
                if (e.touches[i].identifier === activePointerId) {
                    ourTouchEnded = false;
                    break;
                }
            }
            
            if (ourTouchEnded && activePointerId !== null) {
                const duration = Date.now() - touchStartTime;
                activePointerId = null;
                
                // Якщо це був тап (короткий дотик без руху)
                if (!isMovingMouse || duration < 300) {
                    virtualCursor.classList.add('clicking');

                    // Наводимо курсор перед кліком щоб Flash побачив hover
                    sendPointerEvent('pointermove', mouseX, mouseY, 0, 0);
                    sendMouseEvent('mousemove', mouseX, mouseY, 0);
                    sendMouseEvent('mouseover', mouseX, mouseY, 0);

                    sendPointerEvent('pointerdown', mouseX, mouseY, 0, 0.5);
                    sendMouseEvent('mousedown', mouseX, mouseY, 0);
                    
                    setTimeout(() => {
                        sendPointerEvent('pointerup', mouseX, mouseY, 0, 0);
                        sendMouseEvent('mouseup', mouseX, mouseY, 0);
                        sendMouseEvent('click', mouseX, mouseY, 0);
                        virtualCursor.classList.remove('clicking');
                        // pointerleave тільки після кліку
                        sendPointerEvent('pointerleave', mouseX, mouseY, 0, 0);
                    }, 80);
                } else {
                    // Просто рух — відпускаємо
                    sendPointerEvent('pointerleave', mouseX, mouseY, 0, 0);
                }
            }
            
        }, {passive: false, capture: true});
        
        overlay.addEventListener('touchcancel', (e) => {
            e.preventDefault();
            e.stopPropagation();
            
            if (activePointerId !== null) {
                activePointerId = null;
            }
        }, {passive: false, capture: true});
        
        // --- ЗАХИСТ ВІД ВИТОКУ ПОДІЙ ---
        document.addEventListener('touchstart', (e) => {
            // Якщо це не overlay і ми в режимі миші - блокуємо
            if (isMouseMode && e.target !== overlay && !e.target.closest('.control-btn')) {
                e.preventDefault();
                e.stopPropagation();
            }
        }, {passive: false, capture: true});
        
        // --- PINCH ZOOM ---
        let touches = [];
        
        window.addEventListener('touchstart', (e) => {
            if (e.target.closest('.control-btn') || e.target.closest('.mouse-btn') || isMouseMode) {
                return;
            }
            
            touches = Array.from(e.touches);
            
            if (!isKeyboardActive) {
                const player = getTargetElement();
                if (player) player.tabIndex = -1;
            }
            
            if (touches.length === 2) {
                e.preventDefault();
                isPinching = true;
                isPanning = false;
                
                if (document.activeElement) document.activeElement.blur();
                
                startDist = Math.hypot(
                    touches[0].pageX - touches[1].pageX,
                    touches[0].pageY - touches[1].pageY
                );
                startScale = scale;
                startTx = tx;
                startTy = ty;
                midX = (touches[0].pageX + touches[1].pageX) / 2;
                midY = (touches[0].pageY + touches[1].pageY) / 2;
            }
            else if (touches.length === 1 && scale > baseScale * 1.01) {
                isPanning = true;
                isPinching = false;
                panStartX = touches[0].pageX;
                panStartY = touches[0].pageY;
                panInitTx = tx;
                panInitTy = ty;
            }
            
            if (touches.length === 3) {
                infoPanel.classList.toggle('active');
            }
        }, {passive: false, capture: true});
        
        window.addEventListener('touchmove', (e) => {
            if (isMouseMode) return;
            
            touches = Array.from(e.touches);
            
            if (isPinching && touches.length === 2 && startDist > 0) {
                e.preventDefault();
                
                const curDist = Math.hypot(
                    touches[0].pageX - touches[1].pageX,
                    touches[0].pageY - touches[1].pageY
                );
                
                const newScale = Math.max(minScale, Math.min(startScale * (curDist / startDist), maxScale));
                const ratio = newScale / startScale;
                
                tx = midX - (midX - startTx) * ratio;
                ty = midY - (midY - startTy) * ratio;
                scale = newScale;
                
                apply();
            }
            else if (isPanning && touches.length === 1) {
                e.preventDefault();
                
                const deltaX = touches[0].pageX - panStartX;
                const deltaY = touches[0].pageY - panStartY;
                
                tx = panInitTx + deltaX;
                ty = panInitTy + deltaY;
                
                apply();
            }
        }, {passive: false});
        
        window.addEventListener('touchend', (e) => {
            touches = Array.from(e.touches);
            
            if (touches.length < 2) {
                isPinching = false;
            }
            if (touches.length === 0) {
                isPanning = false;
            }
        }, {passive: true});
        
        // --- ФУНКЦІЯ ЗАСТОСУВАННЯ ТРАНСФОРМАЦІЙ ---
        function apply() {
            if (animationFrameId) return;
            
            animationFrameId = requestAnimationFrame(() => {
                updateInfo();
                
                animationFrameId = null;
            });
        }
        
        // --- ІНІЦІАЛІЗАЦІЯ МАСШТАБУ ---
        function initScale() {
            
            scale = 1;
            tx = 0;
            ty = 0;
            apply();
        }
        
        // --- СКИДАННЯ МАСШТАБУ ---
        function resetZoom() {
            initScale();
        }
        
        // --- КНОПКИ КЕРУВАННЯ ---
        function makeDraggable(btn, onToggle) {
            let bX = 0, bY = 0, isDragging = false, isTouched = false;
            let startX, startY, initX, initY;
            
            btn.addEventListener("touchstart", (e) => {
                e.preventDefault();
                e.stopPropagation();
                isTouched = true;
                isDragging = false;
                
                const m = new WebKitCSSMatrix(window.getComputedStyle(btn).transform);
                initX = e.touches[0].clientX - m.m41;
                initY = e.touches[0].clientY - m.m42;
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            }, {passive: false});
            
            window.addEventListener("touchmove", (e) => {
                if (!isTouched) return;
                
                const cx = e.touches[0].clientX;
                const cy = e.touches[0].clientY;
                
                if (Math.hypot(cx - startX, cy - startY) > 10) {
                    isDragging = true;
                }
                
                if (isDragging) {
                    bX = cx - initX;
                    bY = cy - initY;
                    btn.style.transform = `translate3d(${bX}px, ${bY}px, 0)`;
                }
            }, {passive: false});
            
            btn.addEventListener("touchend", (e) => {
                e.preventDefault();
                e.stopPropagation();
                
                if (isTouched && !isDragging) {
                    onToggle();
                }
                isTouched = isDragging = false;
            });
            
            btn.addEventListener("touchcancel", (e) => {
                e.preventDefault();
                e.stopPropagation();
                isTouched = isDragging = false;
            });
        }
        
        // Кнопка миші
        makeDraggable(mouseBtn, () => {
            isMouseMode = !isMouseMode;
            mouseBtn.classList.toggle('active', isMouseMode);
            overlay.style.display = isMouseMode ? 'block' : 'none';
            virtualCursor.style.display = isMouseMode ? 'block' : 'none';
            
            if (isMouseMode) {
                // Центруємо курсор
                updateCursorPosition(window.innerWidth / 2, window.innerHeight / 2);
                
                // Показуємо hint
                mouseHint.classList.add('active');
                setTimeout(() => {
                    mouseHint.classList.remove('active');
                }, 2500);
                
                // Блокуємо реальні події до Ruffle
            } else {
                // Розблоковуємо реальні події
            }
        });
        
        // --- IME PROXY для кирилиці в WebView ---
        const imeProxy = document.getElementById('ime-proxy');
        let lastProxyValue = '';

        imeProxy.addEventListener('input', (e) => {
            const player = document.querySelector("ruffle-player");
            if (!player || !isKeyboardActive) return;

            const newVal = imeProxy.value;
            const oldVal = lastProxyValue;

            if (newVal.length > oldVal.length) {
                // Додано символи
                const added = newVal.slice(oldVal.length);
                for (const char of added) {
                    const code = char.toUpperCase().charCodeAt(0);
                    player.dispatchEvent(new KeyboardEvent('keydown',  { key: char, code: 'Key' + char.toUpperCase(), keyCode: code, charCode: code, bubbles: true }));
                    player.dispatchEvent(new KeyboardEvent('keypress', { key: char, code: 'Key' + char.toUpperCase(), keyCode: code, charCode: code, bubbles: true }));
                    player.dispatchEvent(new KeyboardEvent('keyup',    { key: char, code: 'Key' + char.toUpperCase(), keyCode: code, charCode: code, bubbles: true }));
                }
            } else if (newVal.length < oldVal.length) {
                // Backspace
                player.dispatchEvent(new KeyboardEvent('keydown',  { key: 'Backspace', code: 'Backspace', keyCode: 8, charCode: 0, bubbles: true }));
                player.dispatchEvent(new KeyboardEvent('keyup',    { key: 'Backspace', code: 'Backspace', keyCode: 8, charCode: 0, bubbles: true }));
            }

            lastProxyValue = newVal;
            // Скидаємо щоб не переповнювалось
            if (newVal.length > 50) {
                imeProxy.value = '';
                lastProxyValue = '';
            }
        });

        imeProxy.addEventListener('keydown', (e) => {
            const player = document.querySelector("ruffle-player");
            if (!player || !isKeyboardActive) return;
            // Enter, Tab, стрілки — передаємо напряму
            if (['Enter','Tab','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Escape'].includes(e.key)) {
                player.dispatchEvent(new KeyboardEvent('keydown', { key: e.key, code: e.code, keyCode: e.keyCode, bubbles: true }));
                player.dispatchEvent(new KeyboardEvent('keyup',   { key: e.key, code: e.code, keyCode: e.keyCode, bubbles: true }));
            }
        });

        // Кнопка клавіатури
        makeDraggable(kbdBtn, () => {
            isKeyboardActive = !isKeyboardActive;
            kbdBtn.classList.toggle('active', isKeyboardActive);

            if (isKeyboardActive) {
                lastProxyValue = '';
                imeProxy.value = '';
                imeProxy.style.top = '0px'; // робимо доступним для фокусу
                imeProxy.removeAttribute('disabled');
                imeProxy.focus();
                if (window.AndroidControl) {
                    setTimeout(() => window.AndroidControl.toggleKeyboard(true), 100);
                }
            } else {
                imeProxy.style.top = '-9999px';
                imeProxy.blur();
                if (window.AndroidControl) {
                    window.AndroidControl.toggleKeyboard(false);
                }
            }

            apply();
        });
        
        // Кнопка reset
        makeDraggable(resetBtn, () => {
            resetZoom();
        });

        // --- БЛОКУВАННЯ ФОКУСУ ---
        window.addEventListener('focusin', (e) => {
            if (!isKeyboardActive && e.target.tagName !== 'BUTTON') {
                e.stopImmediatePropagation();
                e.target.blur();
                window.focus();
            }
        }, true);
        
        // --- ІНФО ПАНЕЛЬ ---
        function updateInfo() {
            document.getElementById('info-scale').textContent = scale.toFixed(2);
            document.getElementById('info-pos').textContent = `${Math.round(tx)}, ${Math.round(ty)}`;
            
            const now = performance.now();
            fps = Math.round(1000 / (now - lastFrameTime));
            lastFrameTime = now;
            document.getElementById('info-fps').textContent = fps;
        }
        
        // --- КОНФІГУРАЦІЯ RUFFLE ---
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = { 
            "splashScreen": false, 
            "autoplay": "on",
            "unmuteOverlay": "hidden",
            "quality": "low",
            "preferredRenderer": "webgl",
            "wmode": "direct",
            "allowNetworking": "all",
            "scale": "exactFit",
            "forceScale": true,
            "letterbox": "off",
            "warnOnUnsupportedContent": false,
            "logLevel": "warn",
            "maxExecutionDuration": 30,
            "openUrlMode": "allow",
            "contextMenu": "on",
            "allowScriptAccess": true
        };
        
        // --- ІНІЦІАЛІЗАЦІЯ RUFFLE ---
        window.addEventListener("DOMContentLoaded", () => {
            loadingEl.style.display = 'block';
            
            const player = window.RufflePlayer.newest().createPlayer();
            player.tabIndex = -1;
            
            // Додаємо атрибути для блокування подій
            player.setAttribute('touch-action', 'none');
            player.setAttribute('style', 'touch-action: none; pointer-events: auto;');
            
            const container = document.getElementById("ruffle-container");
            container.appendChild(player);
            
            player.load({ 
                url: "game.swf", 
                allowScriptAccess: true,
                parameters: "",
                backgroundColor: "#000000"
            }).then(() => {
                console.log("Гра завантажена успішно");
                loadingEl.style.display = 'none';
                rufflePlayer = player;
                setTimeout(initScale, 200);
            }).catch(err => {
                console.error("Помилка завантаження гри:", err);
                loadingEl.textContent = "Помилка завантаження";
            });
        });

        // --- ПЕРЕХОПЛЕННЯ ЗОВНІШНІХ ПОСИЛАНЬ ---
        // window.open перехоплення (Ruffle використовує його для getURL/navigateToURL)
        const _origOpen = window.open.bind(window);
        window.open = function(url, target, features) {
            if (url && (url.startsWith('http://') || url.startsWith('https://'))) {
                if (window.AndroidControl && window.AndroidControl.openUrl) {
                    window.AndroidControl.openUrl(url);
                    return null;
                }
            }
            return _origOpen(url, target, features);
        };

        // Перехоплення кліків по <a> тегах (якщо Ruffle рендерить їх)
        document.addEventListener('click', (e) => {
            const a = e.target.closest('a[href]');
            if (!a) return;
            const href = a.getAttribute('href');
            if (href && (href.startsWith('http://') || href.startsWith('https://'))) {
                e.preventDefault();
                if (window.AndroidControl && window.AndroidControl.openUrl) {
                    window.AndroidControl.openUrl(href);
                }
            }
        }, true);
        
        // --- RESIZE ---
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                initScale();
                if (isMouseMode) {
                    updateCursorPosition(mouseX, mouseY);
                }
            }, 100);
        }, {passive: true});
        
        // --- ОЧИЩЕННЯ ---
        window.addEventListener('beforeunload', () => {
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }
        });
    </script>
</body>
</html>
